[project]
name = "travel-with-us-tracker"
version = "1.0.0"
description = "Ежедневно следене на екскурзии в travelwithus.bg (дати, цени, свободни места, бележки „мъж/жена за комбинация“) със SQLite, Slack известия и сайт в GitHub Pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
